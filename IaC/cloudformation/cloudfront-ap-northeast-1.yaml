AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFront distribution for apps.test.com (ap-northeast-1). Uses external ACM certificate (pass ARN). No Route53 resources included.

Parameters:
  CertificateArn:
    Type: String
    Description: ACM certificate ARN created in us-east-1
  OriginAHost:
    Type: String
    Default: AAAA.amplifyapp.com
    Description: Origin A ( /a/* -> A )
  OriginBHost:
    Type: String
    Default: BBBB.amplifyapp.com
    Description: Origin B ( /b/* -> B )

Resources:
  # cloudfront function to strip /b prefix from URI
  StripBFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: StripBPrefixFunction
      AutoPublish: true
      FunctionConfig:
        Comment: "Remove leading /b from viewer request URI"
        Runtime: cloudfront-js-1.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === '/b') {
            request.uri = '/';
          } else if (uri.startsWith('/b/')) {
            request.uri = uri.substring(2);
          }
          return request;
        }

  # cloudfront function to strip /a prefix from URI
  StripAFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: StripAPrefixFunction
      AutoPublish: true
      FunctionConfig:
        Comment: "Remove leading /a from viewer request URI"
        Runtime: cloudfront-js-1.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === '/a') {
            request.uri = '/';
          } else if (uri.startsWith('/a/')) {
            request.uri = uri.substring(2);
          }
          return request;
        }

  # origin request policy to forward all headers/cookies/querystrings for auth
  AuthOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: apps-test-auth-origin-request-policy
        Comment: "Forward all headers, cookies and query strings for auth"
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: allViewer
        QueryStringsConfig:
          QueryStringBehavior: all

  # cache policy to disable caching (for dynamic content with auth)
  NoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: apps-test-no-cache-policy
        Comment: "Minimal caching; forward all headers/cookies/querystrings"
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: allViewer
          CookiesConfig:
            CookieBehavior: all
          QueryStringsConfig:
            QueryStringBehavior: all

  # CloudFront distribution for apps.test.com
  AppsCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - apps.test.com
        DefaultRootObject: index.html
        Origins:
          - Id: origin-aaaa
            DomainName: !Ref OriginAHost
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSslProtocols:
                - TLSv1.2
          - Id: origin-bbbb
            DomainName: !Ref OriginBHost
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSslProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: origin-aaaa
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachePolicyId: !Ref NoCachePolicy
          OriginRequestPolicyId: !Ref AuthOriginRequestPolicy
        CacheBehaviors:
          - PathPattern: /a/*
            TargetOriginId: origin-aaaa
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachePolicyId: !Ref NoCachePolicy
            OriginRequestPolicyId: !Ref AuthOriginRequestPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt StripAFunction.FunctionARN
          - PathPattern: /b/*
            TargetOriginId: origin-bbbb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachePolicyId: !Ref NoCachePolicy
            OriginRequestPolicyId: !Ref AuthOriginRequestPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt StripBFunction.FunctionARN
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Comment: "CloudFront for apps.test.com routing / -> AAAA, /b/* -> BBBB"

Outputs:
  DistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref AppsCloudFrontDistribution
  DistributionDomainName:
    Description: CloudFront Domain Name
    Value: !GetAtt AppsCloudFrontDistribution.DomainName
